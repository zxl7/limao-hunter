#       校验：python3 scripts/validate_tasks.py（对照 automation DB 检查一致性）。
# ⛔ 只改此文件 + automation 两处；禁止再逐任务零散改 prompt。
# ⚠️ 2026-09-03：validate_tasks 只对 ACTIVE 任务比对 rrule（PAUSED=暂挂不触发，
