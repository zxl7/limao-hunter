# nginx.conf —— 云服务器前置反代 + TLS（serve.py 只监听 127.0.0.1:8000）
# 安装：sudo cp nginx.conf /etc/nginx/sites-enabled/limao.conf && sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name limao.your-domain.com;   # ⚠️ 改成你的域名
    # 证书用 certbot：sudo certbot --nginx -d limao.your-domain.com
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name limao.your-domain.com;   # ⚠️ 改成你的域名

    ssl_certificate     /etc/letsencrypt/live/limao.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/limao.your-domain.com/privkey.pem;

    # 大文件/长轮询容错
    client_max_body_size 10m;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
