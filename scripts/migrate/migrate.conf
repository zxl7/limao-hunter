# 迁移目标与开关 —— 所有 migrate 脚本只读这里，不要在脚本里硬编码
#
# MODE 决定「迁多少」：
#   site     只迁站点：Mac 继续产数据 → 服务器 rsync 只读副本 → nginx + serve 只读展示
#            ⛔ 零写入、零调度、零推送，Mac 侧功能完全不变（推荐先跑这个）
#   pipeline 连数据面一起迁：服务器自己抓数据、算指标、推卡片；Mac 只留 AI 研判
#            ⚠️ 必须先「影子运行」几天对比，再真正接管；两边同时跑会重复抓取与重复推送
MODE="${MODE:-site}"

# ── 远端 ──────────────────────────────────────────────
REMOTE_USER="${REMOTE_USER:-ubuntu}"
REMOTE_HOST="${REMOTE_HOST:-43.136.183.186}"
# 远端根目录：放用户家目录下，**不需要 sudo**（systemd 全用 --user 单元）
# 想改到 /opt/limao 的话先手动 `sudo mkdir -p /opt/limao && sudo chown $USER /opt/limao`
REMOTE_ROOT="${REMOTE_ROOT:-/home/ubuntu/limao}"
SSH_OPTS="${SSH_OPTS:--o StrictHostKeyChecking=accept-new -o ConnectTimeout=10}"
# 密码登录（首次）；平时建议配密钥后删掉这行，改用空 REMOTE_PASS
REMOTE_PASS="${REMOTE_PASS:-}"

# ── 本地源 ────────────────────────────────────────────
APP_DIR="${APP_DIR:-/Users/zxl/WorkBuddy/狸猫猎手}"
TERMINAL_DIR="${TERMINAL_DIR:-/Users/zxl/WorkBuddy/狸猫终端}"
# 本地站点端口（serve.py 已在跑的那个）
LOCAL_SERVE_PORT="${LOCAL_SERVE_PORT:-8000}"

# ── 打包排除 ──────────────────────────────────────────
# ⛔ 一律排除：字节码、日志、临时产物、测试缓存、备份
EXCLUDES=(
  "__pycache__"
  "*.pyc"
  "cache/logs"
  "cache/*.log"
  "cache/backups"
  ".pytest_cache"
  ".workbuddy"
  "tests/.pytest_tmp"
  ".pytest_tmp"
  ".pytest_tmp*"
  ".git"          # ⛔ 版本库不进包：13M 且服务器不需要历史
  "node_modules"
)
# site 模式不搬「可重建的大件」：K 线缓存与全量归档由 Mac 侧负责
EXCLUDES_SITE=(
  "cache/kline_qfq"
  "cache/stock_arc"
  "cache/board_leader_daily"
)

# ── 远端运行时 ────────────────────────────────────────
REMOTE_PY="${REMOTE_PY:-/usr/bin/python3}"     # 系统 python3.12，够用；venv 仅在 pipeline 模式装
NGINX_SERVER_NAME="${NGINX_SERVER_NAME:-limao.oscarwl.icu}"
NGINX_LISTEN="${NGINX_LISTEN:-8080}"           # ⛔ 不要抢 80（已被现有站点占用）
